<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de Calma: ancla (Proyecto ANCLA) sobre el cielo nocturno de la app.
       El ancla queda dentro del 80 % central para que Android pueda recortarlo
       (ícono "maskable") sin cortarla. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030B1E"/>
      <stop offset="0.55" stop-color="#001B44"/>
      <stop offset="1" stop-color="#0A4B94"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#FF7A59" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FF7A59" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#cielo)"/>
  <rect width="512" height="512" fill="url(#luz)"/>
  <g fill="#FFFFFF">
    <circle cx="96" cy="104" r="3.5" opacity="0.8"/>
    <circle cx="410" cy="88" r="3" opacity="0.7"/>
    <circle cx="430" cy="210" r="2.5" opacity="0.6"/>
    <circle cx="74" cy="250" r="2.5" opacity="0.55"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="148" r="30"/>
    <path d="M256 178 V404"/>
    <path d="M200 228 H312"/>
    <path d="M150 300 A106 106 0 0 0 362 300"/>
    <path d="M124 322 L150 296 L176 322"/>
    <path d="M336 322 L362 296 L388 322"/>
  </g>
</svg>
